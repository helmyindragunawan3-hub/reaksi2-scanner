<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Scanner — REAKSI 2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#0f1c35;
     min-height:100vh;padding:16px;color:#fff}
.hdr{text-align:center;margin-bottom:18px;padding-top:4px}
.hdr h1{font-size:20px;font-weight:700;color:#c9a84c}
.hdr p{font-size:12px;color:#8899bb;margin-top:3px}
.login-card{max-width:340px;margin:20px auto;
            background:#1a2744;border-radius:14px;padding:28px}
.login-card h2{color:#c9a84c;margin-bottom:6px;font-size:17px}
.login-card p{color:#8899bb;font-size:13px;margin-bottom:18px}
input[type=password],input[type=text]{
  width:100%;padding:10px 13px;border:1px solid #2d4070;
  border-radius:8px;font-size:15px;background:#0f1c35;
  color:#fff;margin-bottom:10px}
input::placeholder{color:#445}
.btn-p{width:100%;padding:12px;background:#c9a84c;color:#1a2744;
       border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
.btn-p:disabled{background:#555;color:#999;cursor:not-allowed}
.err-txt{color:#f87171;font-size:13px;margin-bottom:10px;display:none;
         background:rgba(255,0,0,.1);padding:8px 12px;border-radius:6px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:9px;border-radius:8px;border:none;
     background:#1a2744;color:#8899bb;font-size:13px;
     font-weight:600;cursor:pointer;text-align:center}
.tab.on{background:#c9a84c;color:#1a2744}
#wrap-scan{max-width:400px;margin:0 auto}

/* Kamera — pakai div container, video diisi oleh QrScanner */
.cam-wrap{position:relative;width:100%;border-radius:12px;
          overflow:hidden;background:#000;margin-bottom:12px;
          aspect-ratio:1}
#cam-video{width:100%;height:100%;object-fit:cover;display:block}
.cam-overlay{position:absolute;inset:0;display:flex;
             align-items:center;justify-content:center;pointer-events:none}
.cam-frame{width:220px;height:220px;border:3px solid #c9a84c;
           border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.5)}
.scan-line{position:absolute;width:200px;height:2px;
           background:rgba(201,168,76,.9);
           animation:scanMove 2s ease-in-out infinite}
@keyframes scanMove{
  0%  {top:calc(50% - 108px)}
  50% {top:calc(50% + 108px)}
  100%{top:calc(50% - 108px)}
}
.cam-toggle{display:flex;gap:8px;margin-bottom:10px}
.btn-cam{flex:1;padding:9px;border-radius:8px;border:1px solid #2d4070;
         background:#1a2744;color:#c9a84c;font-size:13px;
         font-weight:600;cursor:pointer}
.btn-cam.on{background:#c9a84c;color:#1a2744;border-color:#c9a84c}
.btn-cam:disabled{background:#1a2744;color:#445;
                  border-color:#2d4070;cursor:not-allowed}
.sts{text-align:center;font-size:12px;color:#8899bb;
     margin-bottom:10px;min-height:16px;line-height:1.5;padding:0 4px}
.sts.ok{color:#4ade80}
.sts.er{color:#f87171}
.manual-row{display:flex;gap:8px;margin-bottom:14px}
.manual-row input{flex:1;margin-bottom:0}
.btn-cek{padding:10px 18px;background:#c9a84c;color:#1a2744;
         border:none;border-radius:8px;font-size:14px;
         font-weight:700;cursor:pointer}
.btn-cek:disabled{background:#555;color:#999;cursor:not-allowed}
.rcard{border-radius:14px;padding:20px;margin-top:4px;
       animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.rcard.ok  {background:#071f0f;border:1.5px solid #166534}
.rcard.warn{background:#1f1200;border:1.5px solid #7c3d12}
.rcard.fail{background:#1f0707;border:1.5px solid #7f1d1d}
.r-icon{font-size:32px;text-align:center;margin-bottom:8px}
.r-nama{font-size:19px;font-weight:700;text-align:center;margin-bottom:3px}
.r-nama.ok  {color:#4ade80}
.r-nama.warn{color:#fb923c}
.r-nama.fail{color:#f87171}
.r-sub{font-size:13px;color:#aaa;text-align:center;margin-bottom:12px}
.r-info{background:rgba(255,255,255,.05);border-radius:8px;
        padding:12px;font-size:13px;line-height:2;color:#ccc}
.r-info b{color:#fff}
.merch-box{margin-top:12px;padding:14px;
           background:rgba(201,168,76,.08);
           border:1px solid rgba(201,168,76,.2);border-radius:10px}
.m-title{font-size:11px;color:#8899bb;text-transform:uppercase;
         letter-spacing:1px;margin-bottom:8px}
.m-paket{font-size:17px;font-weight:700;color:#c9a84c;margin-bottom:2px}
.m-harga{font-size:13px;color:#8899bb;margin-bottom:10px}
.m-sts{display:inline-flex;align-items:center;gap:6px;
       padding:6px 14px;border-radius:7px;font-size:13px;font-weight:700}
.m-sts.lunas{background:#071f0f;color:#4ade80;border:1px solid #166534}
.m-sts.belum{background:#2e0e00;color:#fb923c;border:1px solid #7c2d12}
.m-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.m-dot.lunas{background:#4ade80}
.m-dot.belum{background:#fb923c}
.m-note{margin-top:8px;font-size:12px;color:#fb923c;line-height:1.5}
.nomor-box{margin-top:14px;background:#1a2744;border:2px solid #c9a84c;
           border-radius:12px;padding:16px;text-align:center}
.nomor-label{font-size:11px;color:#8899bb;text-transform:uppercase;
             letter-spacing:2px;margin-bottom:6px}
.nomor-besar{font-size:52px;font-weight:900;color:#c9a84c;
             font-family:Georgia,serif;line-height:1;margin-bottom:4px;
             text-shadow:0 0 20px rgba(201,168,76,.3)}
.nomor-sub{font-size:12px;color:#8899bb}
.btn-print-thermal{width:100%;margin-top:12px;padding:12px;
                   background:#c9a84c;color:#1a2744;border:none;
                   border-radius:9px;font-size:14px;font-weight:700;cursor:pointer}
.btn-next{width:100%;margin-top:10px;padding:12px;background:#1a2744;
          color:#c9a84c;border:1.5px solid #c9a84c;border-radius:9px;
          font-size:14px;font-weight:700;cursor:pointer}
#wrap-doorprize{max-width:400px;margin:0 auto}
.dp-header{background:#1a2744;border-radius:12px;padding:16px;
           margin-bottom:14px;text-align:center}
.dp-total{font-size:36px;font-weight:700;color:#c9a84c}
.dp-lbl{font-size:12px;color:#8899bb;margin-top:2px}
.btn-undi{width:100%;padding:14px;background:#c9a84c;color:#1a2744;
          border:none;border-radius:10px;font-size:16px;
          font-weight:700;cursor:pointer;margin-bottom:14px}
.btn-refresh{width:100%;padding:11px;background:#1a2744;color:#c9a84c;
             border:1px solid #c9a84c;border-radius:9px;font-size:13px;
             font-weight:600;cursor:pointer;margin-bottom:14px}
.modal-bg{display:none;position:fixed;inset:0;
          background:rgba(0,0,0,.8);z-index:200;
          align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#1a2744;border-radius:16px;padding:28px;
       max-width:360px;width:100%;text-align:center;border:2px solid #c9a84c}
.modal h2{color:#c9a84c;font-size:20px;margin-bottom:16px;font-family:Georgia,serif}
.undi-num{font-size:72px;font-weight:900;color:#f0d080;font-family:Georgia,serif;
          line-height:1;margin:16px 0;animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.undi-nama{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px}
.undi-sub{font-size:13px;color:#8899bb}
.btn-modal{padding:12px 28px;background:#c9a84c;color:#1a2744;
           border:none;border-radius:9px;font-size:15px;
           font-weight:700;cursor:pointer;margin-top:18px}
.hadir-item{background:#1a2744;border-radius:9px;padding:12px 14px;
            margin-bottom:7px;display:flex;align-items:center;gap:12px}
.hadir-no{font-size:18px;font-weight:700;color:#c9a84c;
          min-width:52px;font-family:Georgia,serif}
.hadir-info{flex:1}
.hadir-nama{font-size:14px;font-weight:600;color:#fff}
.hadir-sub{font-size:12px;color:#8899bb;margin-top:2px}
.hadir-time{font-size:11px;color:#445;flex-shrink:0}
.thermal-modal{display:none;position:fixed;inset:0;background:#fff;
               z-index:300;overflow-y:auto}
.thermal-modal.show{display:block}
.thermal-content{width:58mm;margin:0 auto;padding:4mm 3mm;
                 font-family:'Courier New',monospace;
                 font-size:9pt;color:#000;line-height:1.5}
.th-center{text-align:center}
.th-bold{font-weight:700}
.th-big{font-size:22pt;font-weight:900;letter-spacing:3px}
.th-line{border-top:1px dashed #000;margin:5px 0}
.th-small{font-size:7.5pt;color:#333}
.btn-close-thermal{position:fixed;top:10px;right:10px;padding:8px 16px;
                   background:#1a2744;color:#fff;border:none;border-radius:7px;
                   font-size:13px;font-weight:600;cursor:pointer;z-index:301}
@media print{
  .btn-close-thermal{display:none!important}
  body>*:not(.thermal-modal){display:none!important}
  .thermal-modal{display:block!important;position:static}
}
.setup-card{max-width:340px;margin:20px auto;
            background:#1a2744;border-radius:14px;padding:28px}
.hidden{display:none}
.loading{text-align:center;color:#8899bb;padding:24px;font-size:14px}
</style>
</head>
<body>

<div class="hdr">
  <h1>REAKSI 2 — Scanner</h1>
  <p>Verifikasi kehadiran &amp; doorprize</p>
</div>

<!-- Setup URL -->
<div id="wrap-setup">
  <div class="setup-card">
    <h2 style="color:#c9a84c;margin-bottom:6px;font-size:17px">Setup Scanner</h2>
    <p style="color:#8899bb;font-size:13px;margin-bottom:18px">
      Masukkan URL GAS deployment (/exec).
    </p>
    <input type="text" id="gas-url"
           placeholder="https://script.google.com/macros/s/.../exec">
    <div class="err-txt" id="err-setup"></div>
    <button class="btn-p" onclick="simpanSetup()">Lanjut →</button>
  </div>
</div>

<!-- Login -->
<div id="wrap-login" class="hidden">
  <div class="login-card">
    <h2>Login Panitia</h2>
    <p>Masukkan password scanner.</p>
    <input type="password" id="pass-in" placeholder="Password scanner"
           onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err-txt" id="err-login"></div>
    <button class="btn-p" id="btn-login" onclick="doLogin()">Masuk</button>
    <button style="width:100%;margin-top:8px;padding:10px;background:none;
                   color:#445;border:none;cursor:pointer;font-size:12px"
            onclick="gantiUrl()">Ganti URL</button>
  </div>
</div>

<!-- Main -->
<div id="wrap-main" class="hidden">
  <div class="tabs">
    <button class="tab on" id="tab-scan" onclick="setTab('scan')">
      📷 Scan
    </button>
    <button class="tab" id="tab-doorprize" onclick="setTab('doorprize')">
      🎁 Doorprize
    </button>
  </div>

  <!-- Scan -->
  <div id="wrap-scan">
    <div class="cam-toggle">
      <button class="btn-cam" id="btn-on"  onclick="aktifkan()">
        📷 Aktifkan Kamera
      </button>
      <button class="btn-cam" id="btn-off" onclick="matikan()" disabled>
        ⏹ Stop
      </button>
    </div>
    <div class="cam-wrap">
      <video id="cam-video" autoplay playsinline muted></video>
      <div class="cam-overlay">
        <div class="cam-frame"></div>
        <div class="scan-line"></div>
      </div>
    </div>
    <div class="sts" id="sts">Tekan Aktifkan Kamera untuk mulai</div>
    <div class="manual-row">
      <input type="text" id="manual-id"
             placeholder="Atau ketik ID tiket manual...">
      <button class="btn-cek" id="btn-cek" onclick="cekManual()">Cek</button>
    </div>
    <div id="hasil"></div>
  </div>

  <!-- Doorprize -->
  <div id="wrap-doorprize" class="hidden">
    <div class="dp-header">
      <div class="dp-total" id="dp-total">0</div>
      <div class="dp-lbl">Peserta Hadir</div>
    </div>
    <button class="btn-undi" onclick="bukaUndi()">🎉 Undi Doorprize!</button>
    <button class="btn-refresh" onclick="muatDoorprize()">🔄 Refresh Data</button>
    <div id="dp-list"><div class="loading">Memuat data...</div></div>
  </div>
</div>

<!-- Modal undi -->
<div class="modal-bg" id="modal-undi">
  <div class="modal">
    <h2>🎉 Pemenang Doorprize</h2>
    <div class="undi-num"  id="undi-num">—</div>
    <div class="undi-nama" id="undi-nama">—</div>
    <div class="undi-sub"  id="undi-sub">—</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn-modal" onclick="undiLagi()">Undi Lagi</button>
      <button class="btn-modal"
              style="background:#1a2744;color:#c9a84c;border:1px solid #c9a84c"
              onclick="tutupUndi()">Tutup</button>
    </div>
  </div>
</div>

<!-- Thermal modal -->
<div class="thermal-modal" id="thermal-modal">
  <button class="btn-close-thermal" onclick="tutupThermal()">✕ Tutup</button>
  <div class="thermal-content" id="thermal-content"></div>
</div>

<!-- QrScanner dari unpkg — lebih reliable dari cdnjs untuk library ini -->
<script src="https://unpkg.com/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
<script>
// ── State ─────────────────────────────────────
var GAS_URL     = '';
var PASS        = '';
var qrScanner   = null;   // instance QrScanner
var bisaScan    = true;
var jsonpN      = 0;
var dpData      = [];
var lastScanRes = null;
var undiInterval= null;

// ── Init ──────────────────────────────────────
(function(){
  var saved = localStorage.getItem('reaksi2_url');
  if(saved){ GAS_URL=saved; document.getElementById('gas-url').value=saved; tampilStep('login'); }
  else { tampilStep('setup'); }
})();

function tampilStep(s){
  ['setup','login','main'].forEach(function(x){
    document.getElementById('wrap-'+x).classList.add('hidden');
  });
  document.getElementById('wrap-'+s).classList.remove('hidden');
}

// ── Setup ─────────────────────────────────────
function simpanSetup(){
  var url=document.getElementById('gas-url').value.trim();
  var err=document.getElementById('err-setup');
  if(!url){showErr(err,'URL tidak boleh kosong.');return;}
  if(url.indexOf('script.google.com')===-1){showErr(err,'URL harus dari script.google.com');return;}
  if(url.indexOf('/exec')===-1){showErr(err,'URL harus berisi /exec');return;}
  GAS_URL=url.split('?')[0];
  localStorage.setItem('reaksi2_url',GAS_URL);
  err.style.display='none';
  tampilStep('login');
}
function gantiUrl(){
  localStorage.removeItem('reaksi2_url');
  GAS_URL='';
  tampilStep('setup');
}

// ── Login ─────────────────────────────────────
function doLogin(){
  var p=document.getElementById('pass-in').value.trim();
  var btn=document.getElementById('btn-login');
  var err=document.getElementById('err-login');
  if(!p)return;
  btn.disabled=true; btn.textContent='Memeriksa...';
  err.style.display='none';
  callGAS('serverCekPass',[p,'scanner'],
    function(res){
      if(res&&res.ok){
        PASS=p;
        tampilStep('main');
        muatDoorprize();
      } else {
        showErr(err,(res&&res.msg)||'Password salah.');
        btn.disabled=false; btn.textContent='Masuk';
      }
    },
    function(e){
      showErr(err,'Gagal konek: '+e);
      btn.disabled=false; btn.textContent='Masuk';
    }
  );
}

// ── Tabs ──────────────────────────────────────
function setTab(tab){
  document.getElementById('wrap-scan').classList.toggle('hidden',tab!=='scan');
  document.getElementById('wrap-doorprize').classList.toggle('hidden',tab!=='doorprize');
  document.getElementById('tab-scan').classList.toggle('on',tab==='scan');
  document.getElementById('tab-doorprize').classList.toggle('on',tab==='doorprize');
  if(tab==='doorprize') muatDoorprize();
}

// ── Kamera — QrScanner (Nimiq) ────────────────
// Berbeda dari jsQR: QrScanner mengelola stream sendiri,
// tidak perlu loop manual atau canvas getImageData.
// Autofokus dan resolusi ditangani otomatis oleh library.
function aktifkan(){
  setSts('Meminta izin kamera...','');

  var video = document.getElementById('cam-video');

  // Buat instance baru kalau belum ada
  if(!qrScanner){
    qrScanner = new QrScanner(
      video,
      function(result){
        // QrScanner v1.4 mengembalikan object {data, ...}
        var teks = (typeof result === 'string') ? result : (result.data || '');
        teks = teks.trim();
        if(!bisaScan || !teks) return;
        bisaScan = false;
        setSts('QR terdeteksi — memeriksa...','ok');
        // Pause setelah deteksi agar tidak double-scan
        qrScanner.pause();
        prosesId(teks);
      },
      {
        // Pakai kamera belakang
        preferredCamera:      'environment',
        // Scan region tengah layar (lebih akurat, lebih cepat)
        calculateScanRegion:  function(video){
          var size = Math.min(video.videoWidth, video.videoHeight) * 0.7;
          return {
            x:      (video.videoWidth  - size) / 2,
            y:      (video.videoHeight - size) / 2,
            width:  size,
            height: size,
          };
        },
        // Matikan highlight bawaan library, kita punya overlay sendiri
        highlightScanRegion:  false,
        highlightCodeOutline: false,
        // Max 10 scan per detik
        maxScansPerSecond:    10,
        // Kembalikan object detail
        returnDetailedScanResult: true,
      }
    );
  }

  qrScanner.start()
    .then(function(){
      bisaScan = true;
      document.getElementById('btn-on').disabled  = true;
      document.getElementById('btn-off').disabled = false;
      document.getElementById('btn-off').classList.add('on');
      setSts('Arahkan kamera ke QR Code','');
    })
    .catch(function(e){
      var msg =
        (String(e).indexOf('NotAllowed')>-1 || String(e).indexOf('Permission')>-1)
          ? 'Izin kamera ditolak — tap ikon kunci di address bar, izinkan kamera, lalu refresh.'
        : (String(e).indexOf('NotFound')>-1)
          ? 'Kamera tidak ditemukan di perangkat ini.'
        : 'Error kamera: '+e;
      setSts(msg,'er');
    });
}

function matikan(){
  if(qrScanner){
    qrScanner.stop();
    // Destroy agar bisa dibuat ulang dengan setting bersih
    qrScanner.destroy();
    qrScanner = null;
  }
  document.getElementById('btn-on').disabled  = false;
  document.getElementById('btn-off').disabled = true;
  document.getElementById('btn-off').classList.remove('on');
  setSts('Kamera dimatikan','');
}

// ── Manual ────────────────────────────────────
function cekManual(){
  var id=document.getElementById('manual-id').value.trim();
  if(!id)return;
  document.getElementById('btn-cek').disabled=true;
  bisaScan=false;
  prosesId(id);
}

// ── Proses ID ─────────────────────────────────
function prosesId(id){
  document.getElementById('hasil').innerHTML=
    '<div class="loading">Memeriksa '+id+'...</div>';
  callGAS('serverScanQR',[PASS,id],
    function(res){ lastScanRes=res; tampilHasil(res); },
    function(e)  { tampilHasil({ok:false,msg:'Error: '+e}); }
  );
}

// ── Tampil hasil ──────────────────────────────
function tampilHasil(res){
  var html='';
  if(res.ok){
    var p=res.peserta;
    html=
      '<div class="rcard ok">'
      +'<div class="r-icon">✅</div>'
      +'<div class="r-nama ok">'+p.nama+'</div>'
      +'<div class="r-sub">Angkatan '+p.tahunLulus+' &nbsp;·&nbsp; '+p.idPeserta+'</div>'
      +'<div class="r-info">'
      +'<b>Status:</b> HADIR ✓<br>'
      +'<b>Email:</b> '+p.email+'<br>'
      +'<b>Merch:</b> '+(p.beliMerch==='YA'?'Ya':'Tidak')
      +'</div>'
      +buatMerchBox(res.order)
      +buatNomorBox(res.nomorUrut,true)
      +'<button class="btn-print-thermal" onclick="cetakThermal()">🖨 Cetak Tiket Registrasi</button>'
      +'<button class="btn-next" onclick="resetScan()">Scan Berikutnya ›</button>'
      +'</div>';
    setSts('✓ No. '+res.nomorUrut+' — hadir tercatat','ok');

  } else if(res.msg==='Tiket sudah digunakan!'){
    var p=res.peserta||{};
    html=
      '<div class="rcard warn">'
      +'<div class="r-icon">⚠️</div>'
      +'<div class="r-nama warn">Tiket Sudah Digunakan</div>'
      +'<div class="r-sub">'+(p.nama||'')+' — '+(p.idPeserta||'')+'</div>'
      +'<div class="r-info">Tiket ini sudah di-scan sebelumnya.<br>'
      +'<b style="color:#fb923c">Tidak bisa digunakan lagi.</b></div>'
      +buatMerchBox(res.order)
      +(res.nomorUrut
        ? buatNomorBox(res.nomorUrut,false)
          +'<button class="btn-print-thermal" onclick="cetakThermal()">🖨 Cetak Ulang Tiket</button>'
        : '')
      +'<button class="btn-next" onclick="resetScan()">Scan Berikutnya ›</button>'
      +'</div>';
    setSts('⚠ Tiket sudah digunakan','');

  } else {
    html=
      '<div class="rcard fail">'
      +'<div class="r-icon">❌</div>'
      +'<div class="r-nama fail">Tidak Valid</div>'
      +'<div class="r-sub">'+(res.msg||'ID tidak ditemukan')+'</div>'
      +'<button class="btn-next" onclick="resetScan()">Coba Lagi ›</button>'
      +'</div>';
    setSts('✗ Tidak valid','er');
  }
  document.getElementById('hasil').innerHTML=html;
}

function buatMerchBox(order){
  if(!order)return'';
  var isLunas=order.statusBayar==='LUNAS';
  var cls=isLunas?'lunas':'belum';
  var stsTxt=isLunas?'✓ LUNAS':'⚠ BELUM LUNAS';
  var note=isLunas?'':'<div class="m-note">Ingatkan peserta menyelesaikan pembayaran.</div>';
  return'<div class="merch-box">'
    +'<div class="m-title">Merchandise dipesan</div>'
    +'<div class="m-paket">'+(order.paketNama||order.paketId)+'</div>'
    +'<div class="m-harga">Rp '+Number(order.harga).toLocaleString('id')+'</div>'
    +'<div class="m-sts '+cls+'"><div class="m-dot '+cls+'"></div>'+stsTxt+'</div>'
    +note+'</div>';
}

function buatNomorBox(nomor,isNew){
  return'<div class="nomor-box">'
    +'<div class="nomor-label">'+(isNew?'Nomor Doorprize Kamu':'Nomor Doorprize')+'</div>'
    +'<div class="nomor-besar">'+nomor+'</div>'
    +'<div class="nomor-sub">'+(isNew?'Simpan nomor ini untuk undian!':'Nomor terdaftar')+'</div>'
    +'</div>';
}

// ── Thermal ───────────────────────────────────
function cetakThermal(){
  if(!lastScanRes)return;
  var p  =lastScanRes.peserta||{};
  var res=lastScanRes;
  var namaAcara=res.namaAcara||'REAKSI 2';
  var tglAcara =res.tglAcara ||'Agustus 2026';
  var lokasi   =res.lokasi   ||'';
  var nomor    =res.nomorUrut||p.nomorUrut||'—';
  var waktu    =new Date().toLocaleString('id-ID',{
    day:'2-digit',month:'2-digit',year:'numeric',
    hour:'2-digit',minute:'2-digit'
  });
  var merchInfo='';
  if(lastScanRes.order){
    var o=lastScanRes.order;
    merchInfo=
      '<div class="th-line"></div>'
      +'<div>Merch : '+(o.paketNama||o.paketId)+'</div>'
      +'<div>Status: '+(o.statusBayar==='LUNAS'?'LUNAS ✓':'BELUM LUNAS')+'</div>';
  }
  document.getElementById('thermal-content').innerHTML=
    '<div class="th-center th-bold" style="font-size:11pt">'+namaAcara+'</div>'
    +'<div class="th-center th-small">Bukti Registrasi Kehadiran</div>'
    +'<div class="th-line"></div>'
    +'<div class="th-bold">'+p.nama+'</div>'
    +'<div>Angkatan '+(p.tahunLulus||'—')+'</div>'
    +'<div class="th-small">'+(p.idPeserta||'')+'</div>'
    +'<div class="th-line"></div>'
    +'<div class="th-center th-small">NOMOR DOORPRIZE</div>'
    +'<div class="th-center th-big">'+nomor+'</div>'
    +'<div class="th-line"></div>'
    +'<div class="th-small">Tanggal : '+tglAcara+'</div>'
    +(lokasi?'<div class="th-small">Lokasi  : '+lokasi+'</div>':'')
    +merchInfo
    +'<div class="th-line"></div>'
    +'<div class="th-center th-small">Scan: '+waktu+'</div>'
    +'<div class="th-center th-small">Simpan tiket ini!</div>'
    +'<div style="height:8mm"></div>';
  document.getElementById('thermal-modal').classList.add('show');
  setTimeout(function(){window.print();},400);
}

function tutupThermal(){
  document.getElementById('thermal-modal').classList.remove('show');
}

// ── Doorprize ─────────────────────────────────
function muatDoorprize(){
  document.getElementById('dp-list').innerHTML=
    '<div class="loading">Memuat data...</div>';
  callGAS('serverGetHadir',[PASS],
    function(res){
      if(res.ok){
        dpData=res.data||[];
        document.getElementById('dp-total').textContent=dpData.length;
        renderDpList();
      } else {
        document.getElementById('dp-list').innerHTML=
          '<div style="color:#f87171;text-align:center;padding:20px;font-size:13px">'
          +(res.msg||'Gagal memuat')+'</div>';
      }
    },
    function(e){
      document.getElementById('dp-list').innerHTML=
        '<div style="color:#f87171;text-align:center;padding:20px;font-size:13px">'
        +'Error: '+e+'</div>';
    }
  );
}

function renderDpList(){
  if(!dpData.length){
    document.getElementById('dp-list').innerHTML=
      '<div style="text-align:center;color:#8899bb;padding:32px;font-size:14px">'
      +'Belum ada peserta hadir.</div>';
    return;
  }
  var html='';
  dpData.forEach(function(d){
    html+='<div class="hadir-item">'
      +'<div class="hadir-no">'+(d.nomorUrut||'—')+'</div>'
      +'<div class="hadir-info">'
      +'<div class="hadir-nama">'+d.nama+'</div>'
      +'<div class="hadir-sub">Angkatan '+d.tahun+'</div>'
      +'</div>'
      +'<div class="hadir-time">'+(d.tsHadir||'')+'</div>'
      +'</div>';
  });
  document.getElementById('dp-list').innerHTML=html;
}

function bukaUndi(){
  if(!dpData.length){alert('Belum ada peserta hadir.');return;}
  document.getElementById('modal-undi').classList.add('show');
  mulaiAnimasiUndi();
}
function mulaiAnimasiUndi(){
  if(undiInterval)clearInterval(undiInterval);
  var count=0;
  undiInterval=setInterval(function(){
    var idx=Math.floor(Math.random()*dpData.length);
    var item=dpData[idx];
    document.getElementById('undi-num').textContent =item.nomorUrut||'—';
    document.getElementById('undi-nama').textContent=item.nama;
    document.getElementById('undi-sub').textContent ='Angkatan '+item.tahun;
    if(++count>=20){
      clearInterval(undiInterval);
      undiInterval=null;
      document.getElementById('undi-num').style.animation='none';
    }
  },150);
}
function undiLagi(){
  document.getElementById('undi-num').style.animation='pulse 1s ease infinite';
  mulaiAnimasiUndi();
}
function tutupUndi(){
  if(undiInterval)clearInterval(undiInterval);
  document.getElementById('modal-undi').classList.remove('show');
}

// ── Reset scan ────────────────────────────────
function resetScan(){
  document.getElementById('hasil').innerHTML='';
  document.getElementById('manual-id').value='';
  document.getElementById('btn-cek').disabled=false;
  lastScanRes=null;
  bisaScan=true;
  setSts('Arahkan kamera ke QR Code','');
  // Resume scanner kalau masih aktif
  if(qrScanner){
    try{ qrScanner.start(); }catch(e){}
  }
}

// ── Helpers ───────────────────────────────────
function setSts(txt,cls){
  var el=document.getElementById('sts');
  el.textContent=txt;
  el.className='sts'+(cls?' '+cls:'');
}
function showErr(el,msg){
  el.textContent=msg;
  el.style.display='block';
}

// ── callGAS via JSONP ─────────────────────────
function callGAS(fn,params,onSuccess,onError){
  var cbName='gcb_'+(++jsonpN)+'_'+Date.now();
  var script=document.createElement('script');
  var done=false;
  var timer=setTimeout(function(){
    if(done)return;
    done=true;cleanup();
    onError('Timeout 15 detik.');
  },15000);
  window[cbName]=function(data){
    if(done)return;
    done=true;cleanup();
    onSuccess(data);
  };
  function cleanup(){
    clearTimeout(timer);
    delete window[cbName];
    if(script.parentNode)script.parentNode.removeChild(script);
  }
  script.onerror=function(){
    if(done)return;
    done=true;cleanup();
    onError('Script error — periksa URL GAS.');
  };
  script.src=GAS_URL
    +'?call='+encodeURIComponent(fn)
    +'&params='+encodeURIComponent(JSON.stringify(params))
    +'&callback='+encodeURIComponent(cbName);
  document.head.appendChild(script);
}
</script>
